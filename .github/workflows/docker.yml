name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    # The integration tests run against a real PostgreSQL and, for the provider synchronisation, a GreenMail test mail server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: matmail
          POSTGRES_DB: matmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.api.hostname=0.0.0.0 -Dgreenmail.api.port=8080
        ports:
          - 3025:3025
          - 3110:3110
          - 3143:3143
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # main -> release (1.2.<run number>-<date>), dev -> nightly (nightly-<run number>-<date>), everything else -> local.
      - name: Determine version metadata
        id: ver
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main) channel=release ;;
            dev)  channel=nightly ;;
            *)    channel=local ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then channel=local; fi
          {
            echo "channel=$channel"
            echo "date=$(date -u +%Y%m%d)"
            echo "build=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MatMail.slnx

      - name: Build
        run: >
          dotnet build MatMail.slnx -c Release --no-restore
          -p:Channel=${{ steps.ver.outputs.channel }}
          -p:BuildNumber=${{ steps.ver.outputs.build }}
          -p:BuildDate=${{ steps.ver.outputs.date }}

      - name: Test
        env:
          MATMAIL_TEST_DB: Host=localhost;Port=5432;Database=matmail_test;Username=postgres;Password=matmail
          MATMAIL_TEST_IMAP: localhost:3143;pop3=localhost:3110;smtp=localhost:3025;api=localhost:8080
        run: dotnet test MatMail.slnx -c Release --no-build --verbosity normal

      - name: Resolve version string
        id: appver
        shell: bash
        run: |
          v=$(dotnet msbuild src/MatMail/MatMail.csproj -getProperty:InformationalVersion \
                -p:Channel=${{ steps.ver.outputs.channel }} \
                -p:BuildNumber=${{ steps.ver.outputs.build }} \
                -p:BuildDate=${{ steps.ver.outputs.date }})
          v=$(echo "$v" | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: img
        shell: bash
        run: echo "name=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release: <version>, latest, release   |   nightly: <version>, nightly   |   pull requests: build only.
      - name: Image tags
        id: tags
        shell: bash
        run: |
          image="${{ steps.img.outputs.name }}"
          version="${{ steps.appver.outputs.version }}"
          case "${{ steps.ver.outputs.channel }}" in
            release) tags="$image:$version"$'\n'"$image:latest"$'\n'"$image:release" ;;
            nightly) tags="$image:$version"$'\n'"$image:nightly" ;;
            *)       tags="$image:$version" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            Channel=${{ steps.ver.outputs.channel }}
            BuildNumber=${{ steps.ver.outputs.build }}
            BuildDate=${{ steps.ver.outputs.date }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
